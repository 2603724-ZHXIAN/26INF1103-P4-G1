# Continuous Integration for the Cyber Threat & Scam Detection Engine.
# Runs the offline unit-test suite on every push and pull request,
# then builds the Docker image and re-runs the tests inside the container.
# No API keys are needed: all AI / VirusTotal calls are mocked in the tests.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

  docker-tests:
    name: Docker build + tests in container
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f dockerfile -t cyber-threat-engine:ci .

      - name: Run tests inside the container
        run: docker run --rm cyber-threat-engine:ci python -m unittest discover -s tests -v
